services:
  web_app:
    build:
      context: .
    container_name: fastapi_app
    command: uvicorn src.main:app --host 0.0.0.0 --reload
    depends_on:
      - db
    environment:
      PYTHONPATH: /app
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:Marauder1353@db:5432/fastapidatabase
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:Marauder1353@db:5432/fastapidatabase
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Marauder1353
      POSTGRES_DB: fastapidatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
